name: 每日更新

on:
  schedule:
    - cron: "0 0 * * *"      # 北京时间 08:00
  workflow_dispatch: {}       # 也可以在 Actions 页面手动点「Run workflow」
  push:
    branches: [main]
    paths: ["data/manual_jobs.yaml", "data/companies.yaml", "config/**", "web/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 测试过滤规则
        run: python -m unittest discover tests
      - name: 抓取并生成数据
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m scripts.pipeline --only none   # 只重新生成，不重新抓取
          else
            python -m scripts.pipeline
          fi
      - name: 抓取出错时开 Issue 提醒
        run: python -m scripts.health
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - name: 提交数据
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: 每日更新 $(date -u +%F)"
          git pull --rebase && git push
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: 构建网站
        working-directory: web
        run: |
          npm ci
          mkdir -p public/data && cp ../data/jobs.json ../data/changes.json public/data/
          npm run build
      - uses: actions/upload-pages-artifact@v4
        with: { path: web/dist }

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
